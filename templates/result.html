<!DOCTYPE html>
<html>
<head>
  <title>Prediction Result</title>
  <style>
    body  { font-family: Arial, sans-serif; max-width: 650px;
            margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    .result-card { background: white; border-radius: 10px;
                   padding: 25px; margin-bottom: 20px;
                   border: 1px solid #ddd; }
    .rating-big  { font-size: 64px; font-weight: bold;
                   color: #185FA5; text-align: center; margin: 10px 0; }
    .rating-label{ text-align: center; color: #666; margin-bottom: 15px; }
    .detail-row  { display: flex; justify-content: space-between;
                   padding: 6px 0; border-bottom: 1px solid #f0f0f0;
                   font-size: 14px; }
    h2  { color: #333; border-bottom: 2px solid #185FA5;
          padding-bottom: 8px; }
    .suggestions { background: white; border-radius: 10px;
                   padding: 25px; border: 1px solid #ddd;
                   white-space: pre-line; line-height: 1.8;
                   font-size: 14px; }
    .back-btn { display: block; text-align: center; margin-top: 20px;
                background: #185FA5; color: white; padding: 12px;
                border-radius: 6px; text-decoration: none; }
    .back-btn:hover { background: #0C447C; }
    .stars { text-align: center; font-size: 28px; margin: 5px 0; }
  </style>
</head>
<body>

  <h1>Prediction Result</h1>

  <div class="result-card">
    <div class="rating-big">{{ rating }}</div>
    <div class="stars">
      {% for i in range(rating | int) %}★{% endfor %}
      {% for i in range(5 - rating | int) %}☆{% endfor %}
    </div>
    <div class="rating-label">Predicted Rating out of 5</div>

    <div class="detail-row">
      <span>City</span><span><b>{{ city }}</b></span>
    </div>
    <div class="detail-row">
      <span>Cuisine</span><span><b>{{ cuisine }}</b></span>
    </div>
    <div class="detail-row">
      <span>Price for two</span><span><b>₹{{ price }}</b></span>
    </div>
  </div>

  <h2>AI Business Suggestions</h2>
  <div class="suggestions">{{ suggestions }}</div>

  <a href="/" class="back-btn">Predict Another Restaurant</a>

</body>
</html>
