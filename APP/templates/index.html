<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Rating Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px;
           margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1   { color: #333; }
    .form-group { margin-bottom: 15px; }
    label  { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; border-radius: 6px;
                    border: 1px solid #ccc; font-size: 14px; }
    button { background: #185FA5; color: white; padding: 12px 30px;
             border: none; border-radius: 6px; font-size: 16px;
             cursor: pointer; width: 100%; margin-top: 10px; }
    button:hover { background: #0C447C; }
  </style>
</head>
<body>

  <h1>Restaurant Rating Predictor</h1>
  <p>Fill in your restaurant details to predict its rating.</p>

  <form action="/predict" method="POST">

    <div class="form-group">
      <label>City</label>
      <select name="city">
        <option>Chennai</option>
        <option>Bangalore</option>
        <option>Mumbai</option>
        <option>Hyderabad</option>
        <option>Kolkata</option>
        <option>Pune</option>
        <option>Kochi</option>
        <option>Coimbatore</option>
        <option>Trichy</option>
        <option>Ahmedabad</option>
        <option>Mangalore</option>
        <option>Mysore</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Area / Neighbourhood</label>
      <input type="text" name="area" placeholder="e.g. Koramangala" required>
    </div>

    <div class="form-group">
      <label>Primary Cuisine</label>
      <select name="cuisine">
        <option>North Indian</option>
        <option>South Indian</option>
        <option>Chinese</option>
        <option>Fast Food</option>
        <option>Cafe</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Price for Two (₹)</label>
      <input type="number" name="price" placeholder="e.g. 500" required>
    </div>

    <div class="form-group">
      <label>Number of Reviews</label>
      <input type="number" name="reviews" placeholder="e.g. 150" required>
    </div>

    <div class="form-group">
      <label>Cost Category</label>
      <select name="cost_category">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" name="hasOnlineDelivery" value="1">
        Has Online Delivery
      </label>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" name="hasTableBooking" value="1">
        Has Table Booking
      </label>
    </div>

    <button type="submit">Predict Rating</button>

  </form>

</body>
</html>
